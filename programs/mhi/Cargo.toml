[package]
name = "mhi"
version = "0.1.0"
description = "Memecoin Health Index Options Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mhi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

[dev-dependencies]
